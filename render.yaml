# Render Blueprint for Green Tech
# Deploy with: render blueprint launch
# Or via Render Dashboard: New > Blueprint

services:
  # =============================================================================
  # Web Service - FastAPI Application
  # =============================================================================
  - type: web
    name: green-tech-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Green Tech
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: STITCH_PROJECT_ID
        value: "17540452302289583695"
      - key: DATABASE_URL
        fromDatabase:
          name: green-tech-db
          property: connectionString
      # Email settings - set these in Render Dashboard after deploy
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false

  # =============================================================================
  # Background Worker - For async tasks (email, routing, etc.)
  # =============================================================================
  - type: worker
    name: green-tech-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Green Tech
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        fromService:
          name: green-tech-api
          envVarKey: SECRET_KEY
      - key: STITCH_PROJECT_ID
        value: "17540452302289583695"
      - key: DATABASE_URL
        fromDatabase:
          name: green-tech-db
          property: connectionString
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false

databases:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  - name: green-tech-db
    databaseName: green_tech
    user: green_tech_user
    plan: starter
    region: oregon
    postgresMajorVersion: 16