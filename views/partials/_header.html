<header class="header" role="banner">

            <svg class="header-logo-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect width="36" height="36" rx="8" fill="currentColor"/>
                <path d="M18 8L12 16H24L18 8Z" fill="white"/>
